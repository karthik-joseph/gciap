databases:
  - name: gciap-db
    databaseName: gciap_db
    user: gciap_user
    plan: free

services:
  - type: web
    name: gciap
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn gciap.wsgi:application"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gciap-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "gciap.onrender.com"
      - key: PYTHON_VERSION
        value: "3.13.0"
