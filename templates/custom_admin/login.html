{% extends 'base/base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden bg-[#020617]">
    <!-- Background Elements -->
    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute top-20 left-10 w-72 h-72 bg-purple-500/20 rounded-full blur-3xl animate-float"></div>
        <div class="absolute bottom-20 right-10 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl animate-float" style="animation-delay: -1.5s;"></div>
    </div>
    
    <div class="max-w-md w-full relative z-10">
        <div class="animate-item text-center mb-8">
            <h2 class="font-boa text-4xl text-gradient tracking-wider">Admin Portal</h2>
            <p class="mt-2 text-slate-400">Restricted Access • Staff Only</p>
        </div>
        
        <div class="animate-item glass-panel rounded-2xl p-8 shadow-2xl border border-slate-700/50">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 rounded-2xl gradient-primary flex items-center justify-center text-white shadow-lg shadow-purple-500/30">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
            </div>
            
            <form method="post" class="space-y-6">
                {% csrf_token %}
                
                {% if messages %}
                <div class="space-y-2">
                    {% for message in messages %}
                    <div class="p-3 rounded-lg text-sm text-center
                        {% if message.tags == 'error' %}bg-rose-500/10 text-rose-400 border border-rose-500/20
                        {% else %}bg-blue-500/10 text-blue-400 border border-blue-500/20{% endif %}">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
                
                <div class="space-y-4">
                    <div>
                        <label for="username" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Username</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                            </span>
                            <input type="text" name="username" id="username" required
                                class="w-full pl-12 pr-4 py-3 rounded-xl bg-slate-900/50 border border-slate-600 placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all duration-300"
                                placeholder="Admin ID">
                        </div>
                    </div>
                    
                    <div>
                        <label for="password" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Password</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            </span>
                            <input type="password" name="password" id="password" required
                                class="w-full pl-12 pr-4 py-3 rounded-xl bg-slate-900/50 border border-slate-600 placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all duration-300"
                                placeholder="••••••••">
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="w-full py-4 rounded-xl gradient-primary text-white font-bold tracking-wide hover:opacity-90 hover:shadow-lg hover:shadow-purple-500/20 hover:-translate-y-0.5 transition-all duration-300">
                    ACCESS DASHBOARD
                </button>
            </form>
            
            <div class="mt-8 text-center border-t border-slate-700/50 pt-6">
                <a href="{% url 'home' %}" class="text-sm text-slate-500 hover:text-white transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Return to Website
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .gradient-primary {
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    }
    
    .glass-panel {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }
    
    .text-gradient {
        background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
</style>

<script>
    anime({
        targets: '.animate-item',
        opacity: [0, 1],
        translateY: [20, 0],
        duration: 800,
        delay: anime.stagger(100),
        easing: 'easeOutExpo'
    });
</script>
{% endblock %}
